name: anychat
description: AnyChat - a personal LLM chat client with transparent context control.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  dynamic_color: ^2.1.0
  shared_preferences: ^2.5.6
  file_picker: ^13.2.0
  image_picker: ^1.1.2
  photo_manager: ^3.6.0
  flutter_markdown: ^0.7.7+1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.3
  markdown: ^7.1.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true
