name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Pub get + codegen
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Compute release tag
        id: rel
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-latest" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean rolling release
        if: steps.rel.outputs.pre == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build-latest --yes --cleanup-tag || true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "AnyChat+-${{ steps.rel.outputs.tag }}.apk"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: ${{ steps.rel.outputs.pre == 'false' }}
          files: AnyChat+-*.apk
