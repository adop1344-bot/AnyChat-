name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, build and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Debug keystore (stable signature, same as local builds)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          cp android/debug.keystore "$HOME/.android/debug.keystore"
          cp android/debug.keystore "$HOME/.config/.android/debug.keystore"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter gen-l10n
        run: flutter gen-l10n

      - name: build_runner (bootstrap drift schema)
        run: dart run build_runner build --build-filter=lib/core/storage/db.g.dart

      - name: verify drift output exists
        run: test -s lib/core/storage/db.g.dart

      - name: build_runner (full)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Verify APK signature
        run: python3 scripts/verify_apk_signature.py build/app/outputs/flutter-apk/app-release.apk "$HOME/.android/debug.keystore"

      - name: Compute release tag
        id: rel
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-latest" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean rolling release
        if: steps.rel.outputs.pre == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete build-latest --yes --cleanup-tag || true

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "AnyChat+-${{ steps.rel.outputs.tag }}.apk"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: ${{ steps.rel.outputs.pre == 'false' }}
          files: AnyChat+-*.apk
